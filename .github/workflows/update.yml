# 公式ショップの情報を毎日自動で取り込み、カレンダーを公開し直す。
# ファイルをアップロードしたとき（push）も、data.js を作り直して公開する。
name: 自動更新・公開

on:
  schedule:
    - cron: '7 15 * * *'   # 毎日 0:07 ごろ（日本時間）。GitHubの混雑で数十分遅れることがあります
  workflow_dispatch:        # Actions 画面の「Run workflow」で手動実行
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 公式ショップの情報を取得
        id: shop
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 scripts/update_shop.py

      - name: data.js を作成
        run: python3 scripts/build.py

      - name: 変更を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shop.json data.js
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動更新 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 公開用ファイルを用意
        run: mkdir _site && cp index.html data.js _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: 公式ショップの取得に失敗したことを知らせる
        if: steps.shop.outcome == 'failure'
        run: |
          echo "::error::公式ショップの取得に失敗しました。公開中のデータは前回のままです。"
          exit 1
